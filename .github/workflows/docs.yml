name: Docs

on:
  push:
    branches: [ master ]
    paths:
      - .docs/**
      - .github/workflows/docs.yml
      - bin/build-docs
      - docs/**
      - img/**
      - package-lock.json
      - package.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Node 24, the major of the Dockerfile's node:24-alpine; lts/* would move on its own.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build docs
        run: bin/build-docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs
      - id: deployment
        uses: actions/deploy-pages@v5
