name: Trivy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The image as it ships, its Alpine packages and its production
      # node_modules, not the checkout with its dev tree (M-12). bin/build
      # ends with bin/self-check, so a broken image stops here too.
      - name: Build the image
        run: bin/build -t authwall-scan

      # Pinned by commit: this action's tags were rewritten in the March 2026 supply-chain attack.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: authwall-scan
          severity: CRITICAL,HIGH
          hide-progress: true
          format: sarif
          output: trivy-results.sarif
          # Reporter, not gate: findings surface in the Security tab. The
          # build is gated on production dependencies by the audit job in
          # node.js.yml (--omit=dev). Failing here would skip the upload
          # below and block every push on a base-image advisory with no
          # fix yet, so this stays 0.
          exit-code: 0

      - name: Upload Trivy scan results
        # always(): still upload the report even if the scan step errored.
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
